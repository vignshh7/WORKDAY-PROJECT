spring:
  application:
    name: interview-scheduler-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's pooled connection endpoints cap concurrent connections low;
      # keep the pool modest so a single instance doesn't exhaust it.
      maximum-pool-size: 10
      minimum-idle: 2

  jackson:
    deserialization:
      # Jackson defaults to normalizing an incoming OffsetDateTime's zone to the context
      # (UTC) zone, which silently turns "10:00+05:30" into "04:30Z" - same instant, but any
      # code reading .toLocalTime()/.toLocalDate() (working-hours/weekend checks) would see
      # the wrong wall-clock value. Keep whatever offset the client actually sent.
      adjust-dates-to-context-time-zone: false

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the source of truth for schema. Hibernate only validates
      # that entities (added in Phase 3) match what Flyway already created.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.interviewscheduler: INFO
