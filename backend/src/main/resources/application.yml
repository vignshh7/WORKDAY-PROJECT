spring:
  application:
    name: interview-scheduler-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's pooled connection endpoints cap concurrent connections low;
      # keep the pool modest so a single instance doesn't exhaust it.
      maximum-pool-size: 10
      minimum-idle: 2

  jackson:
    deserialization:
      # Jackson defaults to normalizing an incoming OffsetDateTime's zone to the context
      # (UTC) zone, which silently turns "10:00+05:30" into "04:30Z" - same instant, but any
      # code reading .toLocalTime()/.toLocalDate() (working-hours/weekend checks) would see
      # the wrong wall-clock value. Keep whatever offset the client actually sent.
      adjust-dates-to-context-time-zone: false

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the source of truth for schema. Hibernate only validates
      # that entities (added in Phase 3) match what Flyway already created.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  ai:
    # Only the OpenAI model client is on the classpath, but this pins it explicitly rather than
    # relying on "one provider present" auto-selection.
    model:
      chat: openai
    openai:
      # Points the OpenAI client at OpenRouter (https://openrouter.ai/api/v1) - a single
      # OpenAI-compatible gateway across many providers (Anthropic, Meta, NVIDIA, etc.), picked
      # over Gemini's own OpenAI-compatibility endpoint after live testing found that every
      # current Gemini model requires a "thought_signature" round-tripped through tool calls
      # (see https://ai.google.dev/gemini-api/docs/thought-signatures) that the generic OpenAI
      # wire protocol has nowhere to carry - a known, currently-unresolved ecosystem-wide gap,
      # not specific to this project. OpenRouter gives access to models with reliable
      # tool-calling support instead.
      # Spring AI's OpenAI client always appends "/v1/chat/completions" to base-url itself
      # (OpenAiApi.Builder's default completionsPath), so base-url must stop at "/api", not
      # "/api/v1" - otherwise the request lands on "/api/v1/v1/chat/completions", which
      # OpenRouter's routing doesn't recognize (falls through to their website's 404 page
      # rather than a JSON API error - caught live, not guessed).
      base-url: https://openrouter.ai/api
      # Blank by default - the app boots fine either way (same "fails at use, not at boot"
      # pattern as calendar.provider=google / notification.email.provider=smtp); only
      # POST /api/ai/schedule actually needs a real key.
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:nvidia/nemotron-3.5-lightning:free}

# Calendar provider: "noop" (default, no external calls) or "google" (requires GOOGLE_* env vars)
calendar:
  provider: noop

# Email provider: "noop" (default, logs only) or "smtp" (requires spring.mail.* / SPRING_MAIL_*
# env vars for the SMTP relay - e.g. SendGrid/Mailgun/Postmark - plus EMAIL_FROM below)
notification:
  email:
    provider: noop

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.interviewscheduler: INFO
